    <div id="content">

            <section id="calculator">
                <div id="display">
                    <label for="display">
                        <input type="text" name="display_one" id="display_one" maxlength="500" readonly>
                        <input type="text" name="display_two" id="display_two"
                            placeholder="Calculate your estimated income.." maxlength="500" readonly>
                    </label>
                </div>
                <div id="btns"></div>
                <div class="input_monthly_total">
                    <label for="input_monthly_total">Input Monthly Total:
                        <span>
                            <input type="number" name="input_monthly_total" id="input_monthly_total">
                            <button type="button" id="next" onclick="submitValue()">Next</button>
                        </span>
                    </label>
                </div>
            </section>

            </svg>

                <h2>ROI Summary</h2>
                <label for="tier">Current Tier:<br>
                    <input type="text" name="tier" id="tier" maxlength="15" readonly>
                </label>
                <label for="monthly_total">Monthly Total:<br>
                    <input type="text" name="monthly_total" id="monthly_total" maxlength="15" readonly>
                </label>
                <label for="est_savings">Estimated Monthly Savings: <svg xmlns="http://www.w3.org/2000/svg"
                        height="24px" viewBox="0 -960 960 960" width="24px" fill="#10b9818c">

            </section>
        </main>
